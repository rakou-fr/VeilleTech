name: Automation Tech Watch

on:
  schedule:
    # Exécution automatique toutes les 6 heures (00h00, 06h00, 12h00, 18h00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installe les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Exécute le script (remplace main.py par le vrai nom du fichier si différent)
      - name: Run news scraper
        run: python scrapper.py

      # 5. Commit et Push des modifications
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "chore: update tech watch news [skip ci]" && git push)