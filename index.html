<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Watch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 30px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            color: #bbb;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* FILTRES */

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter {
            border: none;
            background: white;
            border: 1px solid #ddd;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter:hover {
            background: #eee;
        }

        .filter.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        /* INFORMATIONS */

        .info {
            margin-bottom: 20px;
            color: #666;
        }

        /* ARTICLES */

        #articles {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(300px, 1fr)
            );

            gap: 20px;
        }

        .article {
            background: white;
            border-radius: 12px;
            padding: 20px;

            border: 1px solid #e5e5e5;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .article:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }

        .article-category {
            display: inline-block;

            font-size: 12px;
            font-weight: bold;

            background: #eee;

            padding: 5px 9px;

            border-radius: 6px;

            margin-bottom: 12px;
        }

        .article h2 {
            font-size: 19px;
            margin: 0 0 10px;
        }

        .article h2 a {
            color: #111;
            text-decoration: none;
        }

        .article h2 a:hover {
            text-decoration: underline;
        }

        .description {
            color: #666;
            line-height: 1.5;
            font-size: 14px;
        }

        .meta {
            margin-top: 15px;

            display: flex;
            justify-content: space-between;

            font-size: 12px;
            color: #888;
        }

        .tags {
            margin-top: 15px;

            display: flex;
            flex-wrap: wrap;

            gap: 5px;
        }

        .tag {
            background: #f0f0f0;

            padding: 4px 7px;

            border-radius: 5px;

            font-size: 11px;
            color: #666;
        }

        /* MESSAGE */

        .message {
            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 12px;

            color: #777;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            main {
                margin-top: 20px;
            }

            #articles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Tech Watch</h1>

    <p>
        Veille informatique et technologique
    </p>

</header>


<main>

    <!-- FILTRES -->

    <div
        class="filters"
        id="filters"
    >

        <button
            class="filter active"
            data-category="all"
        >
            Toutes
        </button>

    </div>


    <!-- INFORMATIONS -->

    <div
        class="info"
        id="info"
    >
        Chargement des articles...
    </div>


    <!-- ARTICLES -->

    <div id="articles">

        <div class="message">
            Chargement...
        </div>

    </div>

</main>


<script>

    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     */

    const NEWS_FILE = "news.json";


    /*
     * =========================================================
     * VARIABLES
     * =========================================================
     */

    let articles = [];

    let currentCategory = "all";


    /*
     * =========================================================
     * CHARGER NEWS.JSON
     * =========================================================
     */

    async function loadNews() {

        try {

            const response = await fetch(
                NEWS_FILE
            );

            if (!response.ok) {

                throw new Error(
                    "Impossible de charger news.json"
                );

            }

            const data =
                await response.json();


            articles =
                data.articles || [];


            createFilters();

            displayArticles();


        } catch (error) {

            console.error(error);

            document.getElementById(
                "articles"
            ).innerHTML = `

                <div class="message">

                    Impossible de charger
                    <strong>news.json</strong>.

                    <br><br>

                    Vérifie que le fichier
                    existe bien à côté
                    de index.html.

                </div>

            `;

        }

    }


    /*
     * =========================================================
     * CRÉER LES FILTRES
     * =========================================================
     */

    function createFilters() {

        const filters =
            document.getElementById(
                "filters"
            );


        /*
         * Récupérer toutes les catégories
         */

        const categories = [

            ...new Set(

                articles
                    .map(
                        article =>
                            article.category
                    )
                    .filter(Boolean)

            )

        ];


        /*
         * Trier alphabétiquement
         */

        categories.sort();


        /*
         * Créer les boutons
         */

        categories.forEach(
            category => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "filter";


                button.dataset.category =
                    category;


                button.textContent =
                    formatCategory(
                        category
                    );


                button.addEventListener(
                    "click",
                    () => {

                        currentCategory =
                            category;


                        document
                            .querySelectorAll(
                                ".filter"
                            )
                            .forEach(
                                btn =>
                                    btn.classList
                                        .remove(
                                            "active"
                                        )
                            );


                        button.classList.add(
                            "active"
                        );


                        displayArticles();

                    }
                );


                filters.appendChild(
                    button
                );

            }
        );

    }


    /*
     * =========================================================
     * AFFICHER LES ARTICLES
     * =========================================================
     */

    function displayArticles() {

        const container =
            document.getElementById(
                "articles"
            );


        /*
         * Filtrer
         */

        let filteredArticles =
            articles;


        if (
            currentCategory !== "all"
        ) {

            filteredArticles =
                articles.filter(
                    article =>
                        article.category ===
                        currentCategory
                );

        }


        /*
         * Informations
         */

        document.getElementById(
            "info"
        ).textContent =

            `${filteredArticles.length} article(s)`;


        /*
         * Aucun résultat
         */

        if (
            filteredArticles.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    Aucun article dans
                    cette catégorie.

                </div>

            `;

            return;

        }


        /*
         * Affichage
         */

        container.innerHTML = "";


        filteredArticles.forEach(
            article => {

                container.appendChild(
                    createArticle(
                        article
                    )
                );

            }
        );

    }


    /*
     * =========================================================
     * CRÉER UNE CARTE ARTICLE
     * =========================================================
     */

    function createArticle(
        article
    ) {

        const element =
            document.createElement(
                "article"
            );


        element.className =
            "article";


        /*
         * Tags
         */

        let tagsHTML = "";


        if (
            Array.isArray(
                article.tags
            )
        ) {

            tagsHTML =
                article.tags
                    .map(
                        tag => `
                            <span class="tag">
                                #${escapeHTML(tag)}
                            </span>
                        `
                    )
                    .join("");

        }


        /*
         * Date
         */

        const date =
            formatDate(
                article.published_at
            );


        /*
         * Description
         */

        let description =
            article.description || "";


        /*
         * Limiter la description
         */

        if (
            description.length > 250
        ) {

            description =
                description.substring(
                    0,
                    250
                ) + "...";

        }


        element.innerHTML = `

            <div class="article-category">

                ${escapeHTML(
                    formatCategory(
                        article.category ||
                        "Autre"
                    )
                )}

            </div>


            <h2>

                <a
                    href="${escapeHTML(
                        article.url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${escapeHTML(
                        article.title
                    )}

                </a>

            </h2>


            <div class="description">

                ${escapeHTML(
                    description
                )}

            </div>


            <div class="tags">

                ${tagsHTML}

            </div>


            <div class="meta">

                <span>

                    ${escapeHTML(
                        article.source ||
                        "Source inconnue"
                    )}

                </span>


                <span>

                    ${date}

                </span>

            </div>

        `;


        return element;

    }


    /*
     * =========================================================
     * FORMATTER UNE CATÉGORIE
     * =========================================================
     */

    function formatCategory(
        category
    ) {

        return category
            .replaceAll(
                "_",
                " "
            )
            .replace(
                /\b\w/g,
                letter =>
                    letter.toUpperCase()
            );

    }


    /*
     * =========================================================
     * FORMATTER UNE DATE
     * =========================================================
     */

    function formatDate(
        date
    ) {

        if (!date) {

            return "";

        }


        const parsed =
            new Date(date);


        if (
            Number.isNaN(
                parsed.getTime()
            )
        ) {

            return "";

        }


        return parsed.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    /*
     * =========================================================
     * PROTECTION HTML
     * =========================================================
     */

    function escapeHTML(
        value
    ) {

        return String(value)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /*
     * =========================================================
     * LANCEMENT
     * =========================================================
     */

    loadNews();

</script>

</body>
</html>
